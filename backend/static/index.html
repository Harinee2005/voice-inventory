<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIA — Inventory Assistant</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #0d0f18;
      --surface:     #161923;
      --surface2:    #1e2235;
      --surface3:    #252a40;
      --border:      #2a2f4a;
      --accent:      #5c7cfa;
      --accent-dim:  #3a4f9e;
      --text:        #dde3f5;
      --text-dim:    #7a84a0;
      --text-faint:  #454e6b;
      --green:       #4ade80;
      --yellow:      #facc15;
      --red:         #f87171;
      --orange:      #fb923c;
      --purple:      #a78bfa;
      --cyan:        #22d3ee;
      --radius:      12px;
      --radius-sm:   8px;
      --panel-left:  240px;
      --panel-right: 260px;
    }

    html, body { height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
    }

    /* ─── scrollbar ─── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

    /* ─── header ─── */
    #header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      height: 52px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; letter-spacing: -.5px;
      flex-shrink: 0;
    }
    #header h1 { font-size: 15px; font-weight: 600; letter-spacing: -.2px; }
    #header .sub { font-size: 11px; color: var(--text-dim); }

    .header-gap { flex: 1; }

    #status-pill {
      font-size: 11px; padding: 3px 11px;
      border-radius: 20px;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text-dim); transition: all .25s;
    }
    #status-pill.active {
      color: var(--accent); border-color: var(--accent-dim);
      animation: pulse 1.3s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

    .hdr-btn {
      background: none; border: 1px solid var(--border);
      color: var(--text-dim); padding: 5px 11px;
      border-radius: var(--radius-sm); cursor: pointer; font-size: 11px;
      transition: all .15s;
    }
    .hdr-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── settings bar ─── */
    #settings-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: none;
      gap: 16px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    #settings-bar.open { display: flex; }
    .field { display: flex; flex-direction: column; gap: 3px; }
    .field label { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .08em; }
    .field input, .field select {
      background: var(--bg); border: 1px solid var(--border);
      color: var(--text); padding: 6px 9px;
      border-radius: var(--radius-sm); font-size: 12px; outline: none;
      min-width: 140px;
    }
    .field input:focus, .field select:focus { border-color: var(--accent); }

    /* ─── body layout ─── */
    #body { flex: 1; display: flex; overflow: hidden; }

    /* ─── left panel — inventory ─── */
    #inv-panel {
      width: var(--panel-left);
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel-hdr {
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-dim);
      display: flex; justify-content: space-between; align-items: center;
    }
    .panel-hdr button {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; font-size: 13px; line-height: 1; padding: 1px 4px;
    }
    .panel-hdr button:hover { color: var(--accent); }

    #inv-list {
      flex: 1; overflow-y: auto; padding: 8px 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .inv-group-title {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .07em; color: var(--text-faint);
      padding: 6px 4px 2px;
    }
    .inv-row {
      display: flex; justify-content: space-between; align-items: baseline;
      padding: 4px 6px; border-radius: 6px;
      font-size: 12px;
    }
    .inv-row:hover { background: var(--surface2); }
    .inv-name { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
    .inv-qty  { color: var(--text-dim); font-size: 11px; flex-shrink: 0; margin-left: 6px; }
    .inv-empty { padding: 12px 6px; color: var(--text-faint); font-size: 12px; }
    .inv-loading { padding: 12px 6px; color: var(--text-dim); font-size: 12px; }

    #inv-panel .panel-footer {
      padding: 8px 10px; border-top: 1px solid var(--border);
      font-size: 10px; color: var(--text-faint); text-align: center;
    }

    /* ─── center — chat ─── */
    #chat {
      flex: 1; display: flex; flex-direction: column; overflow: hidden;
      min-width: 0;
    }

    #messages {
      flex: 1; overflow-y: auto; padding: 20px 24px;
      display: flex; flex-direction: column; gap: 18px;
    }

    /* welcome */
    .welcome {
      align-self: center; text-align: center; padding: 32px 16px;
      color: var(--text-dim); max-width: 380px;
    }
    .welcome .w-logo {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      border-radius: 16px; margin: 0 auto 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800;
    }
    .welcome h2 { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .welcome p { font-size: 13px; line-height: 1.6; }
    .welcome .examples { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
    .welcome .ex {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 7px 12px;
      font-size: 12px; color: var(--text); cursor: pointer;
      text-align: left; transition: border-color .15s;
    }
    .welcome .ex:hover { border-color: var(--accent); color: var(--accent); }

    /* messages */
    .msg { display: flex; flex-direction: column; max-width: 80%; }
    .msg.user  { align-self: flex-end;  align-items: flex-end; }
    .msg.aria  { align-self: flex-start; align-items: flex-start; }

    .msg-bubble {
      padding: 10px 14px; border-radius: var(--radius); line-height: 1.6;
      word-break: break-word; font-size: 13px;
    }
    .msg.user .msg-bubble {
      background: var(--accent-dim); color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.aria .msg-bubble {
      background: var(--surface2); border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-meta {
      margin-top: 5px;
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--text-dim);
    }

    /* badges */
    .badge {
      font-size: 10px; padding: 2px 8px; border-radius: 20px;
      font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    }
    .b-confirm { background: rgba(250,204,21,.12); color: var(--yellow); border: 1px solid rgba(250,204,21,.25); }
    .b-update  { background: rgba(74,222,128,.12); color: var(--green);  border: 1px solid rgba(74,222,128,.25); }
    .b-clarify { background: rgba(251,146,60,.12);  color: var(--orange); border: 1px solid rgba(251,146,60,.25); }
    .b-none    { background: rgba(122,132,160,.08); color: var(--text-dim); border: 1px solid rgba(122,132,160,.15); }
    .b-flag    { background: rgba(248,113,113,.12); color: var(--red);   border: 1px solid rgba(248,113,113,.25); }
    .b-saved   { background: rgba(74,222,128,.12); color: var(--green); border: 1px solid rgba(74,222,128,.25); }

    /* confirm card */
    .confirm-card {
      margin-top: 8px;
      background: var(--surface);
      border: 1px solid rgba(250,204,21,.35);
      border-radius: 10px;
      padding: 12px 14px;
      max-width: 400px;
      width: 100%;
    }
    .confirm-card-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--yellow); margin-bottom: 10px;
    }
    .card-table {
      width: 100%; border-collapse: collapse;
      font-size: 12px; margin-bottom: 12px;
    }
    .card-table th {
      text-align: left; padding: 3px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text-dim); font-weight: 500;
    }
    .card-table td {
      padding: 5px 8px;
      border-bottom: 1px solid rgba(42,47,74,.5);
      color: var(--text);
    }
    .card-table tr:last-child td { border-bottom: none; }
    .card-actions { display: flex; gap: 8px; }
    .btn-confirm {
      background: var(--green); color: #000;
      border: none; padding: 7px 18px; border-radius: 7px;
      cursor: pointer; font-size: 12px; font-weight: 700;
      transition: opacity .15s;
    }
    .btn-confirm:hover { opacity: .85; }
    .btn-cancel {
      background: none; color: var(--text-dim);
      border: 1px solid var(--border); padding: 7px 14px;
      border-radius: 7px; cursor: pointer; font-size: 12px;
      transition: border-color .15s;
    }
    .btn-cancel:hover { border-color: var(--red); color: var(--red); }
    .btn-confirm:disabled, .btn-cancel:disabled {
      opacity: .4; cursor: not-allowed;
    }

    /* update card */
    .update-card {
      margin-top: 8px;
      background: rgba(74,222,128,.05);
      border: 1px solid rgba(74,222,128,.25);
      border-radius: 10px;
      padding: 10px 14px;
      max-width: 400px;
      width: 100%;
    }
    .update-card-title {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--green); margin-bottom: 8px;
    }

    /* typing indicator */
    .typing {
      align-self: flex-start;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius); border-bottom-left-radius: 4px;
      padding: 10px 14px; display: flex; align-items: center; gap: 5px;
    }
    .typing span {
      width: 5px; height: 5px;
      background: var(--accent); border-radius: 50%;
      animation: bounce 1.1s infinite;
    }
    .typing span:nth-child(2) { animation-delay: .18s; }
    .typing span:nth-child(3) { animation-delay: .36s; }
    @keyframes bounce {
      0%,80%,100% { transform: translateY(0); }
      40%          { transform: translateY(-5px); }
    }

    .status-step {
      align-self: flex-start;
      font-size: 11px; color: var(--accent); padding: 2px 0 0 2px;
      display: flex; align-items: center; gap: 5px;
    }
    .status-step::before {
      content: ''; display: inline-block;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.3s infinite;
    }

    /* ─── input bar ─── */
    #input-bar {
      padding: 12px 24px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex; gap: 8px; align-items: flex-end;
    }
    #text-input {
      flex: 1; background: var(--bg);
      border: 1px solid var(--border); color: var(--text);
      padding: 10px 13px; border-radius: 10px;
      font-size: 13px; outline: none;
      resize: none; min-height: 40px; max-height: 120px;
      line-height: 1.55; font-family: inherit;
    }
    #text-input:focus { border-color: var(--accent); }
    #text-input::placeholder { color: var(--text-faint); }
    #text-input:disabled { opacity: .5; }

    .stream-lbl {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: var(--text-dim);
      white-space: nowrap; cursor: pointer; margin-bottom: 3px;
    }
    .stream-lbl input { accent-color: var(--accent); }

    #stop-btn {
      background: var(--red); color: #fff; border: none;
      padding: 10px 14px; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: none;
      transition: opacity .15s;
      white-space: nowrap;
    }
    #stop-btn:hover { opacity: .85; }

    #send-btn {
      background: var(--accent); color: #fff; border: none;
      padding: 10px 18px; border-radius: 10px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background .15s; white-space: nowrap;
    }
    #send-btn:hover { background: var(--accent-dim); }
    #send-btn:disabled { background: var(--surface3); color: var(--text-dim); cursor: not-allowed; }

    /* ─── right panel — activity ─── */
    #act-panel {
      width: var(--panel-right);
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #act-list {
      flex: 1; overflow-y: auto;
      padding: 8px 10px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .act-item {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: var(--radius-sm); padding: 8px 10px;
    }
    .act-item-name {
      font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px;
    }
    .act-item-detail {
      font-size: 11px; color: var(--text-dim);
      display: flex; justify-content: space-between;
    }
    .act-time { color: var(--text-faint); font-size: 10px; }
    .act-empty { padding: 12px 6px; color: var(--text-faint); font-size: 12px; }

    /* memory sub-panel inside right panel */
    #mem-section {
      border-top: 1px solid var(--border);
    }
    #mem-toggle-btn {
      width: 100%; background: none; border: none;
      color: var(--text-dim); font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .07em;
      padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
      cursor: pointer;
    }
    #mem-toggle-btn:hover { color: var(--accent); }
    #mem-body { display: none; }
    #mem-body.open { display: flex; flex-direction: column; }
    #mem-list {
      max-height: 180px; overflow-y: auto;
      padding: 6px 10px;
      display: flex; flex-direction: column; gap: 5px;
    }
    .mem-item {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 8px;
      font-size: 11px; line-height: 1.45;
      display: flex; justify-content: space-between; align-items: flex-start; gap: 6px;
    }
    .mem-item button {
      background: none; border: none; color: var(--text-faint);
      cursor: pointer; font-size: 13px; flex-shrink: 0; line-height: 1;
    }
    .mem-item button:hover { color: var(--red); }
    .mem-actions {
      display: flex; gap: 6px; padding: 6px 10px 10px;
    }
    .mem-actions button {
      flex: 1; background: none; border: 1px solid var(--border);
      color: var(--text-dim); padding: 5px 6px; border-radius: 6px;
      cursor: pointer; font-size: 10px;
    }
    .mem-actions button:hover { border-color: var(--accent); color: var(--accent); }

    /* ─── responsive ─── */
    @media (max-width: 900px) {
      #inv-panel { display: none; }
    }
    @media (max-width: 660px) {
      #act-panel { display: none; }
    }
  </style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div class="logo">A</div>
  <div>
    <h1>ARIA</h1>
    <div class="sub">Restaurant Inventory Assistant</div>
  </div>
  <div class="header-gap"></div>
  <span id="status-pill">Ready</span>
  <button class="hdr-btn" id="settings-btn">⚙ Settings</button>
</div>

<!-- Settings bar -->
<div id="settings-bar">
  <div class="field">
    <label>Worker ID</label>
    <input id="cfg-worker" type="text" value="worker1" />
  </div>
  <div class="field">
    <label>Session ID</label>
    <input id="cfg-session" type="text" value="session1" />
  </div>
  <div class="field">
    <label>Storage Area</label>
    <select id="cfg-storage">
      <option value="">— None —</option>
      <option value="Cold Storage">Cold Storage</option>
      <option value="Freezer">Freezer</option>
      <option value="Dry Storage">Dry Storage</option>
      <option value="Bar/Cellar">Bar/Cellar</option>
      <option value="General Storage">General Storage</option>
    </select>
  </div>
  <div class="field">
    <label>Location</label>
    <input id="cfg-location" type="text" placeholder="e.g. Main Kitchen" />
  </div>
</div>

<!-- Body -->
<div id="body">

  <!-- Left: Inventory snapshot -->
  <div id="inv-panel">
    <div class="panel-hdr">
      Inventory
      <button id="inv-refresh-btn" title="Refresh">↻</button>
    </div>
    <div id="inv-list"><div class="inv-loading">Loading…</div></div>
    <div id="inv-panel" class="panel-footer" id="inv-footer" style=""></div>
  </div>

  <!-- Center: Chat -->
  <div id="chat">
    <div id="messages">
      <div class="welcome">
        <div class="w-logo">A</div>
        <h2>Hello, I'm ARIA</h2>
        <p>Your AI inventory assistant. Tell me what to add, remove, or check in your restaurant.</p>
        <div class="examples">
          <button class="ex" data-msg="Add 5 kg of chicken breast">Add 5 kg of chicken breast</button>
          <button class="ex" data-msg="Remove 2 liters of olive oil">Remove 2 liters of olive oil</button>
          <button class="ex" data-msg="What is the total value of cold storage?">What's the total cold storage value?</button>
          <button class="ex" data-msg="Set salmon to 3 kg">Set salmon to 3 kg</button>
        </div>
      </div>
    </div>

    <div id="input-bar">
      <textarea id="text-input" placeholder="Type an inventory command…" rows="1"></textarea>
      <label class="stream-lbl">
        <input type="checkbox" id="stream-toggle" checked />
        Stream
      </label>
      <button id="stop-btn">■ Stop</button>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <!-- Right: Activity log + Memory -->
  <div id="act-panel">
    <div class="panel-hdr">Activity Log</div>
    <div id="act-list"><div class="act-empty">No activity yet.</div></div>

    <div id="mem-section">
      <button id="mem-toggle-btn">
        Memories <span id="mem-chevron">▸</span>
      </button>
      <div id="mem-body">
        <div id="mem-list"><div style="padding:6px 8px;color:var(--text-faint);font-size:11px">Not loaded.</div></div>
        <div class="mem-actions">
          <button id="mem-refresh-btn">Refresh</button>
          <button id="mem-clear-btn" style="color:var(--red)">Clear All</button>
        </div>
      </div>
    </div>
  </div>

</div><!-- /body -->

<script src="chat.js"></script>
</body>
</html>
